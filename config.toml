# `key` aponta para o texto em [translations] / [languages.pt.translations]
[[extra.links]]
key = "nav_home"
path = "/"
[[extra.links]]
key = "nav_impossible_list"
path = "/impossiblelist"
[[extra.links]]
key = "nav_cv"
path = "https://cvwillnunes.netlify.app/"

[extra.authors."Willian Nunes"]
fediverse = ""

